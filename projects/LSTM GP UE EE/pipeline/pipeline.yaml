# PIPELINE DEFINITION
# Name: xr-traffic-mlops-pipeline
# Description: Full MLOps pipeline for XR network traffic arrival time prediction. Trains LSTM and GP Regressor models in parallel, evaluates RMSE, registers both models in Vertex AI Model Registry, runs batch inference, and writes predictions to BigQuery.
# Inputs:
#    bq_dataset: str [Default: 'xr_predictions']
#    gp_n_restarts_optimizer: int [Default: 10.0]
#    gp_n_samples: int [Default: 1000.0]
#    gp_normalize_y: bool [Default: True]
#    gp_train_prop: float [Default: 0.7]
#    lstm_batch_size: int [Default: 128.0]
#    lstm_hidden_size: int [Default: 200.0]
#    lstm_input_size: int [Default: 1.0]
#    lstm_learning_rate: float [Default: 0.004]
#    lstm_lookback: int [Default: 1.0]
#    lstm_num_epochs: int [Default: 18.0]
#    lstm_num_stacked_layers: int [Default: 1.0]
#    model_artefacts_bucket: str
#    model_version: str [Default: 'v1']
#    pipeline_root_bucket: str
#    pipeline_run_id: str [Default: 'run-001']
#    processed_bucket: str
#    project_id: str
#    raw_data_bucket: str
#    region: str
#    test_gcs_path: str [Default: 'xr-traffic/concatenated_df_DN_test.csv']
#    train_gcs_path: str [Default: 'xr-traffic/concatenated_df_DN_train.csv']
components:
  comp-batch-inference:
    executorLabel: exec-batch-inference
    inputDefinitions:
      artifacts:
        gp_model_input:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        lstm_model_input:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        bq_dataset:
          parameterType: STRING
        lstm_lookback:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        model_artefacts_bucket:
          parameterType: STRING
        model_version:
          parameterType: STRING
        pipeline_run_id:
          parameterType: STRING
        processed_bucket:
          parameterType: STRING
        project_id:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        gp_inference_output:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        lstm_inference_output:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-evaluate:
    executorLabel: exec-evaluate
    inputDefinitions:
      artifacts:
        gp_metrics_input:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        lstm_metrics_input:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        combined_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
  comp-gp-training:
    executorLabel: exec-gp-training
    inputDefinitions:
      artifacts:
        gp_test_input:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        gp_train_input:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        model_artefacts_bucket:
          parameterType: STRING
        n_restarts_optimizer:
          defaultValue: 10.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        normalize_y:
          defaultValue: true
          isOptional: true
          parameterType: BOOLEAN
        project_id:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        gp_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        gp_model_output:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-lstm-training:
    executorLabel: exec-lstm-training
    inputDefinitions:
      artifacts:
        lstm_scaler_input:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        lstm_test_input:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        lstm_train_input:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        batch_size:
          defaultValue: 128.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        hidden_size:
          defaultValue: 200.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        input_size:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        learning_rate:
          defaultValue: 0.004
          isOptional: true
          parameterType: NUMBER_DOUBLE
        lookback:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        model_artefacts_bucket:
          parameterType: STRING
        num_epochs:
          defaultValue: 18.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        num_stacked_layers:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        project_id:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        lstm_metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        lstm_model_output:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
  comp-model-upload:
    executorLabel: exec-model-upload
    inputDefinitions:
      artifacts:
        gp_model_input:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        lstm_model_input:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
      parameters:
        model_artefacts_bucket:
          parameterType: STRING
        pipeline_run_id:
          parameterType: STRING
        project_id:
          parameterType: STRING
        region:
          parameterType: STRING
  comp-preprocessing:
    executorLabel: exec-preprocessing
    inputDefinitions:
      parameters:
        gp_n_samples:
          defaultValue: 5000.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        gp_train_prop:
          defaultValue: 0.7
          isOptional: true
          parameterType: NUMBER_DOUBLE
        lstm_lookback:
          defaultValue: 1.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        processed_bucket:
          parameterType: STRING
        project_id:
          parameterType: STRING
        raw_data_bucket:
          parameterType: STRING
        test_gcs_path:
          parameterType: STRING
        train_gcs_path:
          parameterType: STRING
    outputDefinitions:
      artifacts:
        gp_test_output:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        gp_train_output:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        lstm_scaler_output:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        lstm_test_output:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
        lstm_train_output:
          artifactType:
            schemaTitle: system.Artifact
            schemaVersion: 0.0.1
deploymentSpec:
  executors:
    exec-batch-inference:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - batch_inference
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'numpy==1.26.4'\
          \ 'pandas==2.1.4' 'torch==2.1.2' 'scikit-learn==1.3.2' 'google-cloud-storage==2.14.0'\
          \ 'google-cloud-bigquery==3.14.1' 'pyarrow==14.0.2'  &&  python3 -m pip\
          \ install --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef batch_inference(\n    project_id: str,\n    processed_bucket:\
          \ str,\n    model_artefacts_bucket: str,\n    bq_dataset: str,\n    pipeline_run_id:\
          \ str,\n    model_version: str,\n    # Model artefact inputs\n    lstm_model_input:\
          \ Input[Artifact],\n    gp_model_input: Input[Artifact],\n    # Outputs\n\
          \    lstm_inference_output: Output[Artifact],\n    gp_inference_output:\
          \ Output[Artifact],\n    # Config\n    lstm_lookback: int = 1,\n):\n   \
          \ \"\"\"\n    Batch inference component.\n\n    Runs batch prediction for\
          \ both LSTM and GP models on the test set.\n    Loads X_test, y_test, and\
          \ app_test from processed_bucket \u2014 all\n    produced by the preprocessing\
          \ component, no index alignment needed.\n\n    Writes predictions + actuals\
          \ + residuals to BigQuery:\n    - xr_predictions.lstm_predictions\n    -\
          \ xr_predictions.gp_predictions\n    \"\"\"\n    import io\n    import pickle\n\
          \    import numpy as np\n    import pandas as pd\n    import torch\n   \
          \ from google.cloud import storage, bigquery\n    from datetime import datetime,\
          \ timezone\n\n    gcs_client = storage.Client(project=project_id)\n    bq_client\
          \ = bigquery.Client(project=project_id)\n\n    # ------------------------------------------------------------------\
          \ #\n    # Helpers\n    # ------------------------------------------------------------------\
          \ #\n    def download_bytes(bucket_name: str, blob_path: str) -> bytes:\n\
          \        return gcs_client.bucket(bucket_name).blob(blob_path).download_as_bytes()\n\
          \n    def load_npy(bucket_name: str, blob_path: str) -> np.ndarray:\n  \
          \      return np.load(io.BytesIO(download_bytes(bucket_name, blob_path)),\
          \ allow_pickle=False)\n\n    def load_npy_str(bucket_name: str, blob_path:\
          \ str) -> np.ndarray:\n        # App arrays contain strings \u2014 allow_pickle\
          \ required\n        return np.load(io.BytesIO(download_bytes(bucket_name,\
          \ blob_path)), allow_pickle=True)\n\n    def write_to_bigquery(df: pd.DataFrame,\
          \ table_id: str):\n        table_ref = f\"{project_id}.{bq_dataset}.{table_id}\"\
          \n        job_config = bigquery.LoadJobConfig(\n            write_disposition=bigquery.WriteDisposition.WRITE_APPEND,\n\
          \        )\n        job = bq_client.load_table_from_dataframe(df, table_ref,\
          \ job_config=job_config)\n        job.result()\n        print(f\"Written\
          \ {len(df)} rows to {table_ref}\")\n\n    run_timestamp = datetime.now(timezone.utc)\n\
          \n    # ------------------------------------------------------------------\
          \ #\n    # Step 1 \u2014 LSTM batch inference\n    # ------------------------------------------------------------------\
          \ #\n    print(\"=== LSTM Batch Inference ===\")\n\n    X_test_lstm = load_npy(processed_bucket,\
          \ \"lstm/test/X_test.npy\")\n    y_test_lstm = load_npy(processed_bucket,\
          \ \"lstm/test/y_test.npy\")\n    app_test_lstm = load_npy_str(processed_bucket,\
          \ \"lstm/test/app_test.npy\")\n\n    scaler = pickle.loads(download_bytes(model_artefacts_bucket,\
          \ \"lstm/model/lstm_scaler.pkl\"))\n\n    model_bytes = download_bytes(model_artefacts_bucket,\
          \ \"lstm/model/model.pt\")\n    lstm_model = torch.jit.load(io.BytesIO(model_bytes))\n\
          \    lstm_model.eval()\n\n    X_test_t = torch.tensor(X_test_lstm).float()\n\
          \    with torch.no_grad():\n        preds_scaled = lstm_model(X_test_t).numpy().flatten()\n\
          \n    def inverse_transform(vals_scaled: np.ndarray, scaler, lookback: int)\
          \ -> np.ndarray:\n        dummies = np.zeros((len(vals_scaled), lookback\
          \ + 1))\n        dummies[:, 0] = vals_scaled\n        return scaler.inverse_transform(dummies)[:,\
          \ 0]\n\n    lstm_preds = inverse_transform(preds_scaled, scaler, lstm_lookback)\n\
          \    lstm_actuals = inverse_transform(y_test_lstm.flatten(), scaler, lstm_lookback)\n\
          \    lstm_features = inverse_transform(X_test_lstm.reshape(-1), scaler,\
          \ lstm_lookback)\n\n    residuals_lstm = lstm_actuals - lstm_preds\n   \
          \ squared_errors_lstm = residuals_lstm ** 2\n\n    lstm_df = pd.DataFrame({\n\
          \        \"sample_index\":     np.arange(len(lstm_preds)),\n        \"time_t_minus_1\"\
          :   lstm_features,\n        \"actual_time_t\":    lstm_actuals,\n      \
          \  \"predicted_time_t\": lstm_preds,\n        \"residual\":         residuals_lstm,\n\
          \        \"squared_error\":    squared_errors_lstm,\n        \"app\":  \
          \            app_test_lstm,\n        \"run_id\":           pipeline_run_id,\n\
          \        \"run_timestamp\":    pd.to_datetime(run_timestamp, utc=True),\n\
          \        \"model_version\":    model_version,\n    })\n\n    print(f\"LSTM\
          \ predictions shape: {lstm_df.shape}\")\n    print(f\"LSTM test RMSE: {np.sqrt(squared_errors_lstm.mean()):.6f}\"\
          )\n\n    write_to_bigquery(lstm_df, \"lstm_predictions\")\n    lstm_inference_output.uri\
          \ = f\"gs://{model_artefacts_bucket}/lstm/inference/\"\n\n    # ------------------------------------------------------------------\
          \ #\n    # Step 2 \u2014 GP batch inference\n    # ------------------------------------------------------------------\
          \ #\n    print(\"=== GP Batch Inference ===\")\n\n    X_test_gp = load_npy(processed_bucket,\
          \ \"gp/test/X_test.npy\")\n    y_test_gp = load_npy(processed_bucket, \"\
          gp/test/y_test.npy\")\n    app_test_gp = load_npy_str(processed_bucket,\
          \ \"gp/test/app_test.npy\")\n\n    gp_model = pickle.loads(download_bytes(model_artefacts_bucket,\
          \ \"gp/model/model.pkl\"))\n\n    gp_preds = gp_model.predict(X_test_gp).flatten()\n\
          \    gp_actuals = y_test_gp.flatten()\n\n    residuals_gp = gp_actuals -\
          \ gp_preds\n    squared_errors_gp = residuals_gp ** 2\n\n    gp_df = pd.DataFrame({\n\
          \        \"sample_index\":     np.arange(len(gp_preds)),\n        \"time_t_minus_1\"\
          :   X_test_gp.flatten(),\n        \"actual_time_t\":    gp_actuals,\n  \
          \      \"predicted_time_t\": gp_preds,\n        \"residual\":         residuals_gp,\n\
          \        \"squared_error\":    squared_errors_gp,\n        \"app\":    \
          \          app_test_gp,\n        \"run_id\":           pipeline_run_id,\n\
          \        \"run_timestamp\":    pd.to_datetime(run_timestamp, utc=True),\n\
          \        \"model_version\":    model_version,\n    })\n\n    print(f\"GP\
          \ predictions shape: {gp_df.shape}\")\n    print(f\"GP test RMSE: {np.sqrt(squared_errors_gp.mean()):.6f}\"\
          )\n\n    write_to_bigquery(gp_df, \"gp_predictions\")\n    gp_inference_output.uri\
          \ = f\"gs://{model_artefacts_bucket}/gp/inference/\"\n\n    print(\"===\
          \ Batch inference complete ===\")\n\n"
        image: python:3.10-slim
    exec-evaluate:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate(\n    lstm_metrics_input: Input[Metrics],\n    gp_metrics_input:\
          \ Input[Metrics],\n    combined_metrics: Output[Metrics],\n):\n    \"\"\"\
          \n    Evaluation component.\n\n    Reads train and test RMSE from both LSTM\
          \ and GP training components\n    and logs them together in one KFP Metrics\
          \ output for side-by-side\n    visibility in the Vertex AI Pipelines UI.\n\
          \n    No gating. No comparison logic. Both models always proceed to upload.\n\
          \    \"\"\"\n\n    lstm_train_rmse = lstm_metrics_input.metadata.get(\"\
          train_rmse\")\n    lstm_test_rmse = lstm_metrics_input.metadata.get(\"test_rmse\"\
          )\n    gp_train_rmse = gp_metrics_input.metadata.get(\"train_rmse\")\n \
          \   gp_test_rmse = gp_metrics_input.metadata.get(\"test_rmse\")\n\n    combined_metrics.log_metric(\"\
          lstm_train_rmse\", lstm_train_rmse)\n    combined_metrics.log_metric(\"\
          lstm_test_rmse\", lstm_test_rmse)\n    combined_metrics.log_metric(\"gp_train_rmse\"\
          , gp_train_rmse)\n    combined_metrics.log_metric(\"gp_test_rmse\", gp_test_rmse)\n\
          \n    print(\"=== Model RMSE Comparison ===\")\n    print(f\"LSTM  | Train\
          \ RMSE: {lstm_train_rmse:.6f} | Test RMSE: {lstm_test_rmse:.6f}\")\n   \
          \ print(f\"GP    | Train RMSE: {gp_train_rmse:.6f} | Test RMSE: {gp_test_rmse:.6f}\"\
          )\n    print(\"==============================\")\n\n"
        image: python:3.10-slim
    exec-gp-training:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - gp_training
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'numpy==1.26.4'\
          \ 'scikit-learn==1.3.2' 'google-cloud-storage==2.14.0'  &&  python3 -m pip\
          \ install --quiet --no-warn-script-location 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef gp_training(\n    project_id: str,\n    model_artefacts_bucket:\
          \ str,\n    # Inputs from preprocessing\n    gp_train_input: Input[Artifact],\n\
          \    gp_test_input: Input[Artifact],\n    # Outputs\n    gp_model_output:\
          \ Output[Artifact],\n    gp_metrics: Output[Metrics],\n    # Hyperparameters\n\
          \    n_restarts_optimizer: int = 10,\n    normalize_y: bool = True,\n):\n\
          \    \"\"\"\n    GP Regressor training component.\n\n    Replicates PhD\
          \ GP exactly:\n    - Kernel: WhiteKernel + ConstantKernel * Matern(nu=1.5)\n\
          \    - n_restarts_optimizer=10\n    - normalize_y=True\n    - alpha=0.0\n\
          \    - Feature X: Time(t-1), Target y: Time(t)\n    - n=50000 rows, 70/30\
          \ split (done in preprocessing)\n\n    Saves:\n    - model.pkl \u2192 GCS\
          \ model-artefacts/gp/model/\n    - Metrics: train R2, test R2, train MAE,\
          \ test MAE, test RMSE\n    \"\"\"\n    import io\n    import pickle\n  \
          \  import numpy as np\n    from sklearn.gaussian_process import GaussianProcessRegressor\n\
          \    from sklearn.gaussian_process.kernels import (\n        WhiteKernel,\n\
          \        ConstantKernel,\n        Matern,\n    )\n    from sklearn.metrics\
          \ import mean_absolute_error\n    from google.cloud import storage\n\n \
          \   gcs_client = storage.Client(project=project_id)\n\n    # ------------------------------------------------------------------\
          \ #\n    # Helpers\n    # ------------------------------------------------------------------\
          \ #\n    def download_bytes(bucket_name: str, blob_path: str) -> bytes:\n\
          \        bucket = gcs_client.bucket(bucket_name)\n        return bucket.blob(blob_path).download_as_bytes()\n\
          \n    def load_npy(bucket_name: str, blob_path: str) -> np.ndarray:\n  \
          \      data = download_bytes(bucket_name, blob_path)\n        return np.load(io.BytesIO(data),\
          \ allow_pickle=False)\n\n    def upload_bytes(bucket_name: str, blob_path:\
          \ str, data: bytes):\n        bucket = gcs_client.bucket(bucket_name)\n\
          \        bucket.blob(blob_path).upload_from_string(data)\n        print(f\"\
          Uploaded to gs://{bucket_name}/{blob_path}\")\n\n    # ------------------------------------------------------------------\
          \ #\n    # Step 1 \u2014 Load preprocessed arrays from GCS\n    # ------------------------------------------------------------------\
          \ #\n    train_uri = gp_train_input.uri.replace(\"gs://\", \"\")\n    test_uri\
          \ = gp_test_input.uri.replace(\"gs://\", \"\")\n\n    train_bucket = train_uri.split(\"\
          /\")[0]\n    train_prefix = \"/\".join(train_uri.split(\"/\")[1:])\n   \
          \ test_prefix = \"/\".join(test_uri.split(\"/\")[1:])\n\n    print(\"Loading\
          \ GP training arrays...\")\n    X_train = load_npy(train_bucket, f\"{train_prefix}/X_train.npy\"\
          )\n    y_train = load_npy(train_bucket, f\"{train_prefix}/y_train.npy\"\
          )\n    X_test = load_npy(train_bucket, f\"{test_prefix}/X_test.npy\")\n\
          \    y_test = load_npy(train_bucket, f\"{test_prefix}/y_test.npy\")\n\n\
          \    print(f\"X_train: {X_train.shape}, y_train: {y_train.shape}\")\n  \
          \  print(f\"X_test:  {X_test.shape},  y_test:  {y_test.shape}\")\n\n   \
          \ # ------------------------------------------------------------------ #\n\
          \    # Step 2 \u2014 Define kernel (exact PhD configuration)\n    # ------------------------------------------------------------------\
          \ #\n    k0 = WhiteKernel(\n        noise_level=0.3 ** 2,\n        noise_level_bounds=(0.1\
          \ ** 2, 0.5 ** 2),\n    )\n    k1 = ConstantKernel(constant_value=2) * Matern(length_scale=1.0,\
          \ nu=1.5)\n    kernel = k0 + k1\n\n    gp = GaussianProcessRegressor(\n\
          \        kernel=kernel,\n        n_restarts_optimizer=n_restarts_optimizer,\n\
          \        normalize_y=normalize_y,\n        alpha=0.0,\n    )\n\n    # ------------------------------------------------------------------\
          \ #\n    # Step 3 \u2014 Fit\n    # ------------------------------------------------------------------\
          \ #\n    print(\"Fitting GP regressor...\")\n    gp.fit(X_train, y_train)\n\
          \    print(f\"Optimised kernel: {gp.kernel_}\")\n\n    # ------------------------------------------------------------------\
          \ #\n    # Step 4 \u2014 Evaluate\n    # ------------------------------------------------------------------\
          \ #\n    print(\"Evaluating...\")\n\n    train_r2 = float(gp.score(X_train,\
          \ y_train))\n    test_r2 = float(gp.score(X_test, y_test))\n\n    y_train_pred\
          \ = gp.predict(X_train)\n    y_test_pred = gp.predict(X_test)\n\n    train_mae\
          \ = float(mean_absolute_error(y_train, y_train_pred))\n    test_mae = float(mean_absolute_error(y_test,\
          \ y_test_pred))\n\n    train_rmse = float(np.sqrt(np.mean((y_train.flatten()\
          \ - y_train_pred.flatten()) ** 2)))\n    test_rmse = float(np.sqrt(np.mean((y_test.flatten()\
          \ - y_test_pred.flatten()) ** 2)))\n\n    print(f\"Train R2:   {train_r2:.4f}\"\
          )\n    print(f\"Test  R2:   {test_r2:.4f}\")\n    print(f\"Train MAE:  {train_mae:.6f}\"\
          )\n    print(f\"Test  MAE:  {test_mae:.6f}\")\n    print(f\"Train RMSE:\
          \ {train_rmse:.6f}\")\n    print(f\"Test  RMSE: {test_rmse:.6f}\")\n\n \
          \   # Log metrics to KFP\n    gp_metrics.log_metric(\"train_r2\", train_r2)\n\
          \    gp_metrics.log_metric(\"test_r2\", test_r2)\n    gp_metrics.log_metric(\"\
          train_mae\", train_mae)\n    gp_metrics.log_metric(\"test_mae\", test_mae)\n\
          \    gp_metrics.log_metric(\"train_rmse\", train_rmse)\n    gp_metrics.log_metric(\"\
          test_rmse\", test_rmse)\n\n    # ------------------------------------------------------------------\
          \ #\n    # Step 5 \u2014 Save model to GCS\n    # ------------------------------------------------------------------\
          \ #\n    upload_bytes(\n        model_artefacts_bucket,\n        \"gp/model/model.pkl\"\
          ,\n        pickle.dumps(gp),\n    )\n\n    gp_model_output.uri = f\"gs://{model_artefacts_bucket}/gp/model/model.pkl\"\
          \n    print(\"GP model saved to GCS.\")\n\n"
        image: python:3.10-slim
        resources:
          cpuLimit: 8.0
          cpuRequest: 7.0
