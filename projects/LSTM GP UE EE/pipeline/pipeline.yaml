        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'google-cloud-aiplatform==1.38.1'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef model_upload(\n    project_id: str,\n    region: str,\n    model_artefacts_bucket:\
          \ str,\n    pipeline_run_id: str,\n    # Model artefact inputs\n    lstm_model_input:\
          \ Input[Artifact],\n    gp_model_input: Input[Artifact],\n):\n    \"\"\"\
          \n    Model upload component.\n\n    Registers both LSTM and GP models in\
          \ Vertex AI Model Registry.\n    No serving container specified at registration\
          \ time \u2014 container is\n    assigned at deployment time when models\
          \ are deployed to endpoints.\n\n    Both models tagged with pipeline_run_id\
          \ for traceability.\n    No gating \u2014 both models always uploaded.\n\
          \    \"\"\"\n    from google.cloud import aiplatform\n\n    aiplatform.init(project=project_id,\
          \ location=region)\n\n    # ------------------------------------------------------------------\
          \ #\n    # LSTM \u2014 register model artifact only\n    # ------------------------------------------------------------------\
          \ #\n    print(\"Registering LSTM model in Vertex AI Model Registry...\"\
          )\n\n    lstm_model = aiplatform.Model.upload(\n        display_name=\"\
          lstm-arrival-time\",\n        artifact_uri=f\"gs://{model_artefacts_bucket}/lstm/model/\"\
          ,\n        serving_container_image_uri=\"us-docker.pkg.dev/vertex-ai/prediction/pytorch-cpu.1-13:latest\"\
          ,\n        labels={\n            \"model_type\": \"lstm\",\n           \
          \ \"pipeline_run_id\": pipeline_run_id,\n            \"target\": \"arrival_time\"\
          ,\n        },\n    )\n\n    print(f\"LSTM model registered: {lstm_model.resource_name}\"\
          )\n\n    # ------------------------------------------------------------------\
          \ #\n    # GP \u2014 register model artifact only\n    # ------------------------------------------------------------------\
          \ #\n    print(\"Registering GP model in Vertex AI Model Registry...\")\n\
          \n    gp_model = aiplatform.Model.upload(\n        display_name=\"gp-arrival-time\"\
          ,\n        artifact_uri=f\"gs://{model_artefacts_bucket}/gp/model/\",\n\
          \        serving_container_image_uri=\"us-docker.pkg.dev/vertex-ai/prediction/sklearn-cpu.1-3:latest\"\
          ,\n        labels={\n            \"model_type\": \"gaussian_process\",\n\
          \            \"pipeline_run_id\": pipeline_run_id,\n            \"target\"\
          : \"arrival_time\",\n        },\n    )\n\n    print(f\"GP model registered:\
          \ {gp_model.resource_name}\")\n    print(\"Both models registered in Vertex\
          \ AI Model Registry.\")\n\n"
        image: python:3.10-slim
    exec-preprocessing:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - preprocessing
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas==2.1.4'\
          \ 'numpy==1.26.4' 'scikit-learn==1.3.2' 'google-cloud-storage==2.14.0' \
          \ &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef preprocessing(\n    project_id: str,\n    raw_data_bucket: str,\n\
          \    train_gcs_path: str,\n    test_gcs_path: str,\n    processed_bucket:\
          \ str,\n    # LSTM outputs\n    lstm_train_output: Output[Artifact],\n \
          \   lstm_test_output: Output[Artifact],\n    lstm_scaler_output: Output[Artifact],\n\
          \    # GP outputs\n    gp_train_output: Output[Artifact],\n    gp_test_output:\
          \ Output[Artifact],\n    # Config\n    lstm_lookback: int = 1,\n    gp_n_samples:\
          \ int = 5000,#50000,\n    gp_train_prop: float = 0.7,\n):\n    \"\"\"\n\
          \    Preprocessing component for LSTM and GP branches.\n\n    Shared:\n\
          \    - Reads train and test CSVs from GCS\n    - Drops Unnamed: 0\n    -\
          \ Selects Time and App columns\n\n    App is stored as a separate array\
          \ alongside X and y in GCS.\n    Training components (lstm_training, gp_training)\
          \ only use X and y.\n    App is used in batch_inference to annotate BigQuery\
          \ rows.\n\n    LSTM branch:\n    - Builds sliding window dataset (lookback=1)\n\
          \    - Feature: Time(t-1), Target: Time(t)\n    - Fits MinMaxScaler(-1,1)\
          \ on train only, applies to both\n    - Saves X_train, y_train, app_train,\
          \ X_test, y_test, app_test, scaler to GCS\n\n    GP branch:\n    - Subsets\
          \ to n=50000 rows from train CSV\n    - Feature X: Time(t-1), Target y:\
          \ Time(t)\n    - 70/30 internal split\n    - Saves X_train, y_train, app_train,\
          \ X_test, y_test, app_test to GCS\n    \"\"\"\n    import io\n    import\
          \ pickle\n    import numpy as np\n    import pandas as pd\n    from copy\
          \ import deepcopy as dc\n    from sklearn.preprocessing import MinMaxScaler\n\
          \    from google.cloud import storage\n\n    gcs_client = storage.Client(project=project_id)\n\
          \n    # ------------------------------------------------------------------\
          \ #\n    # Helpers\n    # ------------------------------------------------------------------\
          \ #\n    def read_csv_from_gcs(bucket_name: str, blob_path: str) -> pd.DataFrame:\n\
          \        bucket = gcs_client.bucket(bucket_name)\n        blob = bucket.blob(blob_path)\n\
          \        content = blob.download_as_bytes()\n        return pd.read_csv(io.BytesIO(content))\n\
          \n    def upload_bytes_to_gcs(bucket_name: str, blob_path: str, data: bytes):\n\
          \        bucket = gcs_client.bucket(bucket_name)\n        blob = bucket.blob(blob_path)\n\
          \        blob.upload_from_string(data)\n        print(f\"Uploaded to gs://{bucket_name}/{blob_path}\"\
          )\n\n    def upload_pickle_to_gcs(bucket_name: str, blob_path: str, obj):\n\
          \        upload_bytes_to_gcs(bucket_name, blob_path, pickle.dumps(obj))\n\
          \n    def upload_numpy_to_gcs(bucket_name: str, blob_path: str, arr: np.ndarray):\n\
          \        buf = io.BytesIO()\n        np.save(buf, arr)\n        upload_bytes_to_gcs(bucket_name,\
          \ blob_path, buf.getvalue())\n\n    # ------------------------------------------------------------------\
          \ #\n    # Step 1 \u2014 Read raw CSVs from GCS\n    # ------------------------------------------------------------------\
          \ #\n    print(\"Reading train CSV from GCS...\")\n    train_df = read_csv_from_gcs(raw_data_bucket,\
          \ train_gcs_path)\n    print(f\"Train shape: {train_df.shape}\")\n\n   \
          \ print(\"Reading test CSV from GCS...\")\n    test_df = read_csv_from_gcs(raw_data_bucket,\
          \ test_gcs_path)\n    print(f\"Test shape: {test_df.shape}\")\n\n    # ------------------------------------------------------------------\
          \ #\n    # Step 2 \u2014 Shared cleaning: keep Time and App\n    # ------------------------------------------------------------------\
          \ #\n    def clean(df: pd.DataFrame) -> pd.DataFrame:\n        if \"Unnamed:\
          \ 0\" in df.columns:\n            df.drop(\"Unnamed: 0\", axis=1, inplace=True)\n\
          \        df = df[[\"Time\", \"App\"]].copy()\n        assert df[\"Time\"\
          ].isnull().sum() == 0, \"Nulls found in Time column\"\n        print(f\"\
          Clean shape: {df.shape}\")\n        return df\n\n    train_df = clean(train_df)\n\
          \    test_df = clean(test_df)\n\n    # ------------------------------------------------------------------\
          \ #\n    # Step 3 \u2014 LSTM branch\n    # ------------------------------------------------------------------\
          \ #\n    print(\"=== LSTM Preprocessing ===\")\n\n    def build_lstm_dataset(df:\
          \ pd.DataFrame, lookback: int):\n        data = dc(df)\n        for i in\
          \ range(1, lookback + 1):\n            data[f\"Time(t-{i})\"] = data[\"\
          Time\"].shift(i)\n        data.dropna(inplace=True)\n\n        app = data[\"\
          App\"].values                # keep App separate\n        arr = data.drop(\"\
          App\", axis=1).to_numpy()\n        y = arr[:, 0]                       \
          \    # Time(t) \u2014 target\n        X = arr[:, 1:]                   \
          \       # Time(t-1) \u2014 feature\n        X = np.flip(X, axis=1)     \
          \             # mirror as per PhD code\n        return X, y, app\n\n   \
          \ X_train_lstm, y_train_lstm, app_train_lstm = build_lstm_dataset(train_df,\
          \ lstm_lookback)\n    X_test_lstm, y_test_lstm, app_test_lstm = build_lstm_dataset(test_df,\
          \ lstm_lookback)\n\n    print(f\"LSTM train X: {X_train_lstm.shape}, y:\
          \ {y_train_lstm.shape}, app: {app_train_lstm.shape}\")\n    print(f\"LSTM\
          \ test  X: {X_test_lstm.shape}, y: {y_test_lstm.shape}, app: {app_test_lstm.shape}\"\
          )\n\n    # Fit scaler on train only \u2014 stack X and y as per PhD approach\n\
          \    train_combined = np.hstack([y_train_lstm.reshape(-1, 1), X_train_lstm])\n\
          \    test_combined = np.hstack([y_test_lstm.reshape(-1, 1), X_test_lstm])\n\
          \n    scaler = MinMaxScaler(feature_range=(-1, 1))\n    train_scaled = scaler.fit_transform(train_combined)\n\
          \    test_scaled = scaler.transform(test_combined)\n\n    X_train_lstm_scaled\
          \ = train_scaled[:, 1:].reshape(-1, lstm_lookback, 1)\n    y_train_lstm_scaled\
          \ = train_scaled[:, 0].reshape(-1, 1)\n    X_test_lstm_scaled = test_scaled[:,\
          \ 1:].reshape(-1, lstm_lookback, 1)\n    y_test_lstm_scaled = test_scaled[:,\
          \ 0].reshape(-1, 1)\n\n    print(f\"LSTM train scaled X: {X_train_lstm_scaled.shape},\
          \ y: {y_train_lstm_scaled.shape}\")\n\n    # Upload LSTM artefacts \u2014\
          \ X, y, app stored separately\n    upload_pickle_to_gcs(processed_bucket,\
          \ \"lstm/scaler/lstm_scaler.pkl\", scaler)\n    upload_numpy_to_gcs(processed_bucket,\
          \ \"lstm/train/X_train.npy\", X_train_lstm_scaled)\n    upload_numpy_to_gcs(processed_bucket,\
          \ \"lstm/train/y_train.npy\", y_train_lstm_scaled)\n    upload_numpy_to_gcs(processed_bucket,\
          \ \"lstm/train/app_train.npy\", app_train_lstm)\n    upload_numpy_to_gcs(processed_bucket,\
          \ \"lstm/test/X_test.npy\", X_test_lstm_scaled)\n    upload_numpy_to_gcs(processed_bucket,\
          \ \"lstm/test/y_test.npy\", y_test_lstm_scaled)\n    upload_numpy_to_gcs(processed_bucket,\
          \ \"lstm/test/app_test.npy\", app_test_lstm)\n\n    lstm_train_output.uri\
          \ = f\"gs://{processed_bucket}/lstm/train\"\n    lstm_test_output.uri =\
          \ f\"gs://{processed_bucket}/lstm/test\"\n    lstm_scaler_output.uri = f\"\
          gs://{processed_bucket}/lstm/scaler/lstm_scaler.pkl\"\n\n    print(\"LSTM\
          \ preprocessing complete.\")\n\n    # ------------------------------------------------------------------\
          \ #\n    # Step 4 \u2014 GP branch\n    # ------------------------------------------------------------------\
          \ #\n    print(\"=== GP Preprocessing ===\")\n\n    gp_df = train_df.iloc[:gp_n_samples].copy()\n\
          \    gp_df[\"Time_prev\"] = gp_df[\"Time\"].shift(1)\n    gp_df.dropna(inplace=True)\n\
          \n    X_gp = gp_df[\"Time_prev\"].values.reshape(-1, 1)\n    y_gp = gp_df[\"\
          Time\"].values.reshape(-1, 1)\n    app_gp = gp_df[\"App\"].values\n\n  \
          \  n_train_gp = round(gp_train_prop * len(X_gp))\n    X_train_gp = X_gp[:n_train_gp]\n\
          \    y_train_gp = y_gp[:n_train_gp]\n    app_train_gp = app_gp[:n_train_gp]\n\
          \    X_test_gp = X_gp[n_train_gp:]\n    y_test_gp = y_gp[n_train_gp:]\n\
          \    app_test_gp = app_gp[n_train_gp:]\n\n    print(f\"GP train X: {X_train_gp.shape},\
          \ y: {y_train_gp.shape}, app: {app_train_gp.shape}\")\n    print(f\"GP test\
          \  X: {X_test_gp.shape}, y: {y_test_gp.shape}, app: {app_test_gp.shape}\"\
          )\n\n    upload_numpy_to_gcs(processed_bucket, \"gp/train/X_train.npy\"\
          , X_train_gp)\n    upload_numpy_to_gcs(processed_bucket, \"gp/train/y_train.npy\"\
          , y_train_gp)\n    upload_numpy_to_gcs(processed_bucket, \"gp/train/app_train.npy\"\
          , app_train_gp)\n    upload_numpy_to_gcs(processed_bucket, \"gp/test/X_test.npy\"\
          , X_test_gp)\n    upload_numpy_to_gcs(processed_bucket, \"gp/test/y_test.npy\"\
          , y_test_gp)\n    upload_numpy_to_gcs(processed_bucket, \"gp/test/app_test.npy\"\
          , app_test_gp)\n\n    gp_train_output.uri = f\"gs://{processed_bucket}/gp/train\"\
          \n    gp_test_output.uri = f\"gs://{processed_bucket}/gp/test\"\n\n    print(\"\
          GP preprocessing complete.\")\n    print(\"=== Preprocessing done ===\"\
          )\n\n"
        image: python:3.10-slim
pipelineInfo:
  description: Full MLOps pipeline for XR network traffic arrival time prediction.
    Trains LSTM and GP Regressor models in parallel, evaluates RMSE, registers both
    models in Vertex AI Model Registry, runs batch inference, and writes predictions
    to BigQuery.
  name: xr-traffic-mlops-pipeline
root:
  dag:
    tasks:
      batch-inference:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-batch-inference
        dependentTasks:
        - gp-training
        - lstm-training
        - model-upload
        inputs:
          artifacts:
            gp_model_input:
              taskOutputArtifact:
                outputArtifactKey: gp_model_output
                producerTask: gp-training
            lstm_model_input:
              taskOutputArtifact:
                outputArtifactKey: lstm_model_output
                producerTask: lstm-training
          parameters:
            bq_dataset:
              componentInputParameter: bq_dataset
            lstm_lookback:
              componentInputParameter: lstm_lookback
            model_artefacts_bucket:
              componentInputParameter: model_artefacts_bucket
            model_version:
              componentInputParameter: model_version
            pipeline_run_id:
              componentInputParameter: pipeline_run_id
            processed_bucket:
              componentInputParameter: processed_bucket
            project_id:
              componentInputParameter: project_id
        taskInfo:
          name: batch-inference
      evaluate:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-evaluate
        dependentTasks:
        - gp-training
        - lstm-training
        inputs:
          artifacts:
            gp_metrics_input:
              taskOutputArtifact:
                outputArtifactKey: gp_metrics
                producerTask: gp-training
            lstm_metrics_input:
              taskOutputArtifact:
                outputArtifactKey: lstm_metrics
                producerTask: lstm-training
        taskInfo:
          name: evaluate
      gp-training:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-gp-training
        dependentTasks:
        - preprocessing
        inputs:
          artifacts:
            gp_test_input:
              taskOutputArtifact:
                outputArtifactKey: gp_test_output
                producerTask: preprocessing
            gp_train_input:
              taskOutputArtifact:
                outputArtifactKey: gp_train_output
                producerTask: preprocessing
          parameters:
            model_artefacts_bucket:
              componentInputParameter: model_artefacts_bucket
            n_restarts_optimizer:
              componentInputParameter: gp_n_restarts_optimizer
            normalize_y:
              componentInputParameter: gp_normalize_y
            project_id:
              componentInputParameter: project_id
        taskInfo:
          name: gp-training
      lstm-training:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-lstm-training
        dependentTasks:
        - preprocessing
        inputs:
          artifacts:
            lstm_scaler_input:
              taskOutputArtifact:
                outputArtifactKey: lstm_scaler_output
                producerTask: preprocessing
            lstm_test_input:
              taskOutputArtifact:
                outputArtifactKey: lstm_test_output
                producerTask: preprocessing
            lstm_train_input:
              taskOutputArtifact:
                outputArtifactKey: lstm_train_output
                producerTask: preprocessing
          parameters:
            batch_size:
              componentInputParameter: lstm_batch_size
            hidden_size:
              componentInputParameter: lstm_hidden_size
            input_size:
              componentInputParameter: lstm_input_size
            learning_rate:
              componentInputParameter: lstm_learning_rate
            lookback:
              componentInputParameter: lstm_lookback
            model_artefacts_bucket:
              componentInputParameter: model_artefacts_bucket
            num_epochs:
              componentInputParameter: lstm_num_epochs
            num_stacked_layers:
              componentInputParameter: lstm_num_stacked_layers
            project_id:
              componentInputParameter: project_id
        taskInfo:
          name: lstm-training
      model-upload:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-model-upload
        dependentTasks:
        - evaluate
        - gp-training
        - lstm-training
        inputs:
          artifacts:
            gp_model_input:
              taskOutputArtifact:
                outputArtifactKey: gp_model_output
                producerTask: gp-training
            lstm_model_input:
              taskOutputArtifact:
                outputArtifactKey: lstm_model_output
                producerTask: lstm-training
          parameters:
            model_artefacts_bucket:
              componentInputParameter: model_artefacts_bucket
            pipeline_run_id:
              componentInputParameter: pipeline_run_id
            project_id:
              componentInputParameter: project_id
            region:
              componentInputParameter: region
        taskInfo:
          name: model-upload
      preprocessing:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-preprocessing
        inputs:
          parameters:
            gp_n_samples:
              componentInputParameter: gp_n_samples
            gp_train_prop:
              componentInputParameter: gp_train_prop
            lstm_lookback:
              componentInputParameter: lstm_lookback
            processed_bucket:
              componentInputParameter: processed_bucket
            project_id:
              componentInputParameter: project_id
            raw_data_bucket:
              componentInputParameter: raw_data_bucket
            test_gcs_path:
              componentInputParameter: test_gcs_path
            train_gcs_path:
              componentInputParameter: train_gcs_path
        taskInfo:
          name: preprocessing
  inputDefinitions:
    parameters:
      bq_dataset:
        defaultValue: xr_predictions
        isOptional: true
        parameterType: STRING
      gp_n_restarts_optimizer:
        defaultValue: 10.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      gp_n_samples:
        defaultValue: 1000.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      gp_normalize_y:
        defaultValue: true
        isOptional: true
        parameterType: BOOLEAN
      gp_train_prop:
        defaultValue: 0.7
        isOptional: true
        parameterType: NUMBER_DOUBLE
      lstm_batch_size:
        defaultValue: 128.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      lstm_hidden_size:
        defaultValue: 200.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      lstm_input_size:
        defaultValue: 1.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      lstm_learning_rate:
        defaultValue: 0.004
        isOptional: true
        parameterType: NUMBER_DOUBLE
      lstm_lookback:
        defaultValue: 1.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      lstm_num_epochs:
        defaultValue: 18.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      lstm_num_stacked_layers:
        defaultValue: 1.0
        isOptional: true
        parameterType: NUMBER_INTEGER
      model_artefacts_bucket:
        parameterType: STRING
      model_version:
        defaultValue: v1
        isOptional: true
        parameterType: STRING
      pipeline_root_bucket:
        parameterType: STRING
      pipeline_run_id:
        defaultValue: run-001
        isOptional: true
        parameterType: STRING
      processed_bucket:
        parameterType: STRING
      project_id:
        parameterType: STRING
      raw_data_bucket:
        parameterType: STRING
      region:
        parameterType: STRING
      test_gcs_path:
        defaultValue: xr-traffic/concatenated_df_DN_test.csv
        isOptional: true
        parameterType: STRING
      train_gcs_path:
        defaultValue: xr-traffic/concatenated_df_DN_train.csv
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
