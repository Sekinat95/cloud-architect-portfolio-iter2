    exec-lstm-training:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - lstm_training
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'numpy==1.26.4'\
          \ 'torch==2.1.2' 'scikit-learn==1.3.2' 'google-cloud-storage==2.14.0' 'torch-model-archiver==0.9.0'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef lstm_training(\n    project_id: str,\n    model_artefacts_bucket:\
          \ str,\n    # Inputs from preprocessing\n    lstm_train_input: Input[Artifact],\n\
          \    lstm_test_input: Input[Artifact],\n    lstm_scaler_input: Input[Artifact],\n\
          \    # Output\n    lstm_model_output: Output[Artifact],\n    lstm_metrics:\
          \ Output[Metrics],\n    # Hyperparameters\n    input_size: int = 1,\n  \
          \  hidden_size: int = 200,\n    num_stacked_layers: int = 1,\n    batch_size:\
          \ int = 128,\n    num_epochs: int = 18,#600,\n    learning_rate: float =\
          \ 0.004,\n    lookback: int = 1,\n):\n    \"\"\"\n    LSTM training component.\n\
          \n    Replicates PhD LSTM exactly:\n    - Architecture: LSTM(1, 200, 1)\
          \ + Linear(200, 1)\n    - Loss: MSELoss\n    - Optimizer: Adam lr=0.004\n\
          \    - Epochs: 600\n    - Input: scaled Time(t-1), Target: scaled Time(t)\n\
          \n    Saves:\n    - model.mar (TorchServe archive bundling model.pt + lstm_scaler.pkl\
          \ + handler.py)\n      \u2192 GCS model-artefacts/lstm/model/\n    - train\
          \ RMSE and val RMSE logged to KFP Metrics\n    \"\"\"\n    import io\n \
          \   import os\n    import pickle\n    import subprocess\n    import tempfile\n\
          \    import numpy as np\n    import torch\n    import torch.nn as nn\n \
          \   from torch.utils.data import Dataset, DataLoader\n    from google.cloud\
          \ import storage\n\n    gcs_client = storage.Client(project=project_id)\n\
          \n    # ------------------------------------------------------------------\
          \ #\n    # Helpers\n    # ------------------------------------------------------------------\
          \ #\n    def download_bytes(bucket_name: str, blob_path: str) -> bytes:\n\
          \        return gcs_client.bucket(bucket_name).blob(blob_path).download_as_bytes()\n\
          \n    def load_npy(bucket_name: str, blob_path: str) -> np.ndarray:\n  \
          \      return np.load(io.BytesIO(download_bytes(bucket_name, blob_path)),\
          \ allow_pickle=False)\n\n    def upload_bytes(bucket_name: str, blob_path:\
          \ str, data: bytes):\n        gcs_client.bucket(bucket_name).blob(blob_path).upload_from_string(data)\n\
          \        print(f\"Uploaded to gs://{bucket_name}/{blob_path}\")\n\n    def\
          \ upload_file(bucket_name: str, blob_path: str, local_path: str):\n    \
          \    gcs_client.bucket(bucket_name).blob(blob_path).upload_from_filename(local_path)\n\
          \        print(f\"Uploaded to gs://{bucket_name}/{blob_path}\")\n\n    #\
          \ ------------------------------------------------------------------ #\n\
          \    # Step 1 \u2014 Load preprocessed arrays from GCS\n    # ------------------------------------------------------------------\
          \ #\n    train_uri = lstm_train_input.uri.replace(\"gs://\", \"\")\n   \
          \ test_uri = lstm_test_input.uri.replace(\"gs://\", \"\")\n\n    train_bucket\
          \ = train_uri.split(\"/\")[0]\n    train_prefix = \"/\".join(train_uri.split(\"\
          /\")[1:])\n    test_prefix = \"/\".join(test_uri.split(\"/\")[1:])\n\n \
          \   print(\"Loading LSTM training arrays...\")\n    X_train = load_npy(train_bucket,\
          \ f\"{train_prefix}/X_train.npy\")\n    y_train = load_npy(train_bucket,\
          \ f\"{train_prefix}/y_train.npy\")\n    X_test = load_npy(train_bucket,\
          \ f\"{test_prefix}/X_test.npy\")\n    y_test = load_npy(train_bucket, f\"\
          {test_prefix}/y_test.npy\")\n\n    print(f\"X_train: {X_train.shape}, y_train:\
          \ {y_train.shape}\")\n    print(f\"X_test:  {X_test.shape},  y_test:  {y_test.shape}\"\
          )\n\n    # ------------------------------------------------------------------\
          \ #\n    # Step 2 \u2014 Tensors and DataLoaders\n    # ------------------------------------------------------------------\
          \ #\n    device = \"cuda:0\" if torch.cuda.is_available() else \"cpu\"\n\
          \    print(f\"Device: {device}\")\n\n    X_train_t = torch.tensor(X_train).float()\n\
          \    y_train_t = torch.tensor(y_train).float()\n    X_test_t = torch.tensor(X_test).float()\n\
          \    y_test_t = torch.tensor(y_test).float()\n\n    class TimeSeriesDataset(Dataset):\n\
          \        def __init__(self, X, y):\n            self.X = X\n           \
          \ self.y = y\n\n        def __len__(self):\n            return len(self.X)\n\
          \n        def __getitem__(self, idx):\n            return self.X[idx], self.y[idx]\n\
          \n    train_loader = DataLoader(\n        TimeSeriesDataset(X_train_t, y_train_t),\n\
          \        batch_size=batch_size,\n        shuffle=True,\n    )\n    test_loader\
          \ = DataLoader(\n        TimeSeriesDataset(X_test_t, y_test_t),\n      \
          \  batch_size=batch_size,\n        shuffle=False,\n    )\n\n    # ------------------------------------------------------------------\
          \ #\n    # Step 3 \u2014 Model definition (exact PhD architecture)\n   \
          \ # ------------------------------------------------------------------ #\n\
          \    class LSTMModel(nn.Module):\n        def __init__(self, input_size,\
          \ hidden_size, num_stacked_layers):\n            super().__init__()\n  \
          \          self.hidden_size = hidden_size\n            self.num_stacked_layers\
          \ = num_stacked_layers\n            self.lstm = nn.LSTM(\n             \
          \   input_size, hidden_size, num_stacked_layers, batch_first=True\n    \
          \        )\n            self.fc = nn.Linear(hidden_size, 1)\n\n        def\
          \ forward(self, x):\n            batch_size = x.size(0)\n            h0\
          \ = torch.zeros(self.num_stacked_layers, batch_size, self.hidden_size).to(device)\n\
          \            c0 = torch.zeros(self.num_stacked_layers, batch_size, self.hidden_size).to(device)\n\
          \            out, _ = self.lstm(x, (h0, c0))\n            out = self.fc(out[:,\
          \ -1, :])\n            return out\n\n    model = LSTMModel(input_size, hidden_size,\
          \ num_stacked_layers).to(device)\n    loss_fn = nn.MSELoss()\n    optimiser\
          \ = torch.optim.Adam(model.parameters(), lr=learning_rate)\n\n    # ------------------------------------------------------------------\
          \ #\n    # Step 4 \u2014 Training loop\n    # ------------------------------------------------------------------\
          \ #\n    print(\"Starting training...\")\n    best_val_loss = float(\"inf\"\
          )\n    best_model_state = None\n\n    for epoch in range(num_epochs):\n\
          \        model.train()\n        train_loss = 0.0\n        for x_batch, y_batch\
          \ in train_loader:\n            x_batch, y_batch = x_batch.to(device), y_batch.to(device)\n\
          \            output = model(x_batch)\n            loss = loss_fn(output,\
          \ y_batch)\n            optimiser.zero_grad()\n            loss.backward()\n\
          \            optimiser.step()\n            train_loss += loss.item()\n\n\
          \        model.eval()\n        val_loss = 0.0\n        with torch.no_grad():\n\
          \            for x_batch, y_batch in test_loader:\n                x_batch,\
          \ y_batch = x_batch.to(device), y_batch.to(device)\n                output\
          \ = model(x_batch)\n                val_loss += loss_fn(output, y_batch).item()\n\
          \n        avg_train_loss = train_loss / len(train_loader)\n        avg_val_loss\
          \ = val_loss / len(test_loader)\n\n        if (epoch + 1) % 50 == 0:\n \
          \           print(f\"Epoch {epoch+1}/{num_epochs} | Train Loss: {avg_train_loss:.6f}\
          \ | Val Loss: {avg_val_loss:.6f}\")\n\n        if avg_val_loss < best_val_loss:\n\
          \            best_val_loss = avg_val_loss\n            best_model_state\
          \ = {k: v.clone() for k, v in model.state_dict().items()}\n\n    print(\"\
          Training complete.\")\n\n    # ------------------------------------------------------------------\
          \ #\n    # Step 5 \u2014 Compute RMSE on unscaled predictions\n    # ------------------------------------------------------------------\
          \ #\n    scaler_bucket = lstm_scaler_input.uri.replace(\"gs://\", \"\").split(\"\
          /\")[0]\n    scaler_blob = \"/\".join(lstm_scaler_input.uri.replace(\"gs://\"\
          , \"\").split(\"/\")[1:])\n    scaler = pickle.loads(download_bytes(scaler_bucket,\
          \ scaler_blob))\n\n    model.load_state_dict(best_model_state)\n    model.eval()\n\
          \    model.to(device)\n\n    with torch.no_grad():\n        train_preds_scaled\
          \ = model(X_train_t.to(device)).cpu().numpy().flatten()\n        test_preds_scaled\
          \ = model(X_test_t.to(device)).cpu().numpy().flatten()\n\n    def inverse_transform_preds(preds_scaled,\
          \ actuals_scaled, scaler, lookback):\n        dummies = np.zeros((len(preds_scaled),\
          \ lookback + 1))\n        dummies[:, 0] = preds_scaled\n        preds_unscaled\
          \ = scaler.inverse_transform(dummies)[:, 0]\n        dummies[:, 0] = actuals_scaled.flatten()\n\
          \        actuals_unscaled = scaler.inverse_transform(dummies)[:, 0]\n  \
          \      return preds_unscaled, actuals_unscaled\n\n    train_preds, train_actuals\
          \ = inverse_transform_preds(train_preds_scaled, y_train, scaler, lookback)\n\
          \    test_preds, test_actuals = inverse_transform_preds(test_preds_scaled,\
          \ y_test, scaler, lookback)\n\n    train_rmse = float(np.sqrt(np.mean((train_actuals\
          \ - train_preds) ** 2)))\n    test_rmse = float(np.sqrt(np.mean((test_actuals\
          \ - test_preds) ** 2)))\n\n    print(f\"Train RMSE: {train_rmse:.6f}\")\n\
          \    print(f\"Test  RMSE: {test_rmse:.6f}\")\n\n    lstm_metrics.log_metric(\"\
          train_rmse\", train_rmse)\n    lstm_metrics.log_metric(\"test_rmse\", test_rmse)\n\
          \    lstm_metrics.log_metric(\"best_val_loss\", best_val_loss)\n    lstm_metrics.log_metric(\"\
          epochs\", num_epochs)\n\n    # ------------------------------------------------------------------\
          \ #\n    # Step 6 \u2014 Export as TorchScript + package as model.mar\n\
          \    # ------------------------------------------------------------------\
          \ #\n    model.load_state_dict(best_model_state)\n    model.eval()\n   \
          \ model.to(\"cpu\")\n\n    with tempfile.TemporaryDirectory() as tmpdir:\n\
          \n        # 6a \u2014 Save TorchScript model\n        model_pt_path = os.path.join(tmpdir,\
          \ \"model.pt\")\n        example_input = torch.zeros(1, lookback, 1)\n \
          \       scripted_model = torch.jit.trace(model, example_input)\n       \
          \ torch.jit.save(scripted_model, model_pt_path)\n        print(\"TorchScript\
          \ model saved.\")\n\n        # 6b \u2014 Save scaler as extra file\n   \
          \     scaler_path = os.path.join(tmpdir, \"lstm_scaler.pkl\")\n        with\
          \ open(scaler_path, \"wb\") as f:\n            pickle.dump(scaler, f)\n\
          \        print(\"Scaler saved.\")\n\n        # 6c \u2014 Write TorchServe\
          \ handler\n        handler_path = os.path.join(tmpdir, \"handler.py\")\n\
          \        handler_code = '''\nimport io\nimport os\nimport pickle\nimport\
          \ numpy as np\nimport torch\nfrom ts.torch_handler.base_handler import BaseHandler\n\
          \nclass LSTMHandler(BaseHandler):\n    \"\"\"\n    TorchServe handler for\
          \ LSTM arrival time prediction.\n    Expects input: {\"instances\": [[time_t_minus_1_value]]}\n\
          \    Returns: {\"predictions\": [predicted_time_t]}\n    \"\"\"\n\n    def\
          \ initialize(self, context):\n        super().initialize(context)\n    \
          \    # Load scaler from model archive extra files\n        model_dir = context.system_properties.get(\"\
          model_dir\")\n        scaler_path = os.path.join(model_dir, \"lstm_scaler.pkl\"\
          )\n        with open(scaler_path, \"rb\") as f:\n            self.scaler\
          \ = pickle.load(f)\n        self.lookback = 1\n        self.initialized\
          \ = True\n\n    def preprocess(self, data):\n        \"\"\"Scale input using\
          \ fitted scaler.\"\"\"\n        instances = data[0].get(\"body\", {}).get(\"\
          instances\", [])\n        inputs = np.array(instances, dtype=np.float32)\
          \  # shape (n, 1)\n        # Reconstruct combined array for scaler: [y_placeholder,\
          \ X]\n        combined = np.hstack([np.zeros((len(inputs), 1)), inputs])\n\
          \        scaled = self.scaler.transform(combined)\n        X_scaled = scaled[:,\
          \ 1:].reshape(-1, self.lookback, 1)\n        return torch.tensor(X_scaled).float()\n\
          \n    def inference(self, inputs):\n        with torch.no_grad():\n    \
          \        return self.model(inputs)\n\n    def postprocess(self, outputs):\n\
          \        \"\"\"Inverse transform predictions back to original scale.\"\"\
          \"\n        preds_scaled = outputs.numpy().flatten()\n        dummies =\
          \ np.zeros((len(preds_scaled), self.lookback + 1))\n        dummies[:, 0]\
          \ = preds_scaled\n        preds_unscaled = self.scaler.inverse_transform(dummies)[:,\
          \ 0]\n        return [{\"predictions\": preds_unscaled.tolist()}]\n'''\n\
          \        with open(handler_path, \"w\") as f:\n            f.write(handler_code)\n\
          \        print(\"Handler written.\")\n\n        # 6d \u2014 Run torch-model-archiver\n\
          \        mar_output_dir = os.path.join(tmpdir, \"mar_output\")\n       \
          \ os.makedirs(mar_output_dir, exist_ok=True)\n\n        cmd = [\n      \
          \      \"torch-model-archiver\",\n            \"--model-name\", \"lstm_arrival_time\"\
          ,\n            \"--version\", \"1.0\",\n            \"--serialized-file\"\
          , model_pt_path,\n            \"--handler\", handler_path,\n           \
          \ \"--extra-files\", scaler_path,\n            \"--export-path\", mar_output_dir,\n\
          \            \"--f\",\n        ]\n        result = subprocess.run(cmd, capture_output=True,\
          \ text=True)\n        if result.returncode != 0:\n            raise RuntimeError(f\"\
          torch-model-archiver failed:\\n{result.stderr}\")\n        print(\"model.mar\
          \ created.\")\n\n        # 6e \u2014 Upload model.mar to GCS (for online\
          \ serving via Vertex AI endpoint)\n        mar_path = os.path.join(mar_output_dir,\
          \ \"lstm_arrival_time.mar\")\n        # Rename to model.mar for Vertex AI\
          \ PyTorch container\n        model_mar_path = os.path.join(mar_output_dir,\
          \ \"model.mar\")\n        os.rename(mar_path, model_mar_path)\n        upload_file(model_artefacts_bucket,\
          \ \"lstm/model/model.mar\", model_mar_path)\n\n        # 6f \u2014 Upload\
          \ model.pt and lstm_scaler.pkl separately for batch inference\n        #\
          \ batch_inference.py loads these directly from GCS \u2014 it does not unpack\
          \ the .mar\n        upload_file(model_artefacts_bucket, \"lstm/model/model.pt\"\
          , model_pt_path)\n        upload_file(model_artefacts_bucket, \"lstm/model/lstm_scaler.pkl\"\
          , scaler_path)\n\n    lstm_model_output.uri = f\"gs://{model_artefacts_bucket}/lstm/model/\"\
          \n    print(\"LSTM model.mar, model.pt and lstm_scaler.pkl uploaded to GCS.\"\
          )\n\n"
        image: python:3.10-slim
